# Hacked font build configuration. Sourced by container/build-font.sh.

# Family name shown in font pickers. Must differ from "Hack" to install side by side.
FAMILY="Hacked"

# alt-hack glyph directories to apply (see src/alt-hack/glyphs or the specimen page).
# Optional "@style,style" suffix limits an entry to those styles (regular, bold, italic,
# bolditalic); without it the entry applies to all four.
ALTERNATES=(
    u0030-diamond
    u0033-flattop
    u003C-wider u003E-wider
    # Slab i in upright styles only; italics keep Hack's default i.
    u0069-slab@regular,bold u00EC-slab@regular,bold u00ED-slab@regular,bold
    u00EE-slab@regular,bold u00EF-slab@regular,bold u0129-slab@regular,bold
    u012B-slab@regular,bold u012D-slab@regular,bold u012F-slab@regular,bold
    u0131-slab@regular,bold u0456-slab@regular,bold u0457-slab@regular,bold
)

# Appended to the version string (name ID 5) so an installed copy says what it contains.
# Not shown in font pickers.
VERSION_NOTE="Hacked: 0-diamond 3-flattop <>-wider i-slab(upright)"
